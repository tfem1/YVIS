# /etc/yone/yone.conf — GraveyardOS package manager configuration

[options]
arch = x86_64
# stable | testing | dev
channel = stable
# simultaneous downloads
parallel = 4
# required | optional | never   (keep "required")
siglevel = required
# compression used by `yone build`: zstd | xz
compression = zstd

# Repositories are searched in this order.
# The repository host is not decided yet: these URLs are placeholders and
# will be replaced by the real mirror list before v0.1.0.
[core]
server = https://github.com/graveyard/graveyard/releases/download/repo-$channel-$repo

[extra]
server = https://github.com/graveyard/graveyard/releases/download/repo-$channel-$repo
