# Boot menu of the GraveyardOS live medium (BIOS and UEFI).
# @LABEL@, @VERSION@ and @CMDLINE@ are filled in by iso/build.sh.

set default=0
set timeout=10
set menu_color_normal=white/black
set menu_color_highlight=black/light-magenta

# A graphics mode for the kernel's first console (on UEFI there is no text
# mode once the firmware is left).
insmod all_video

search --no-floppy --set=root --label @LABEL@

menuentry "GraveyardOS @VERSION@ live" --id graveyard {
    linux /boot/vmlinuz graveyard.live=@LABEL@ @CMDLINE@
    initrd /boot/initramfs.img
}

# For a screen that stays black or garbled: no graphics driver, the
# firmware's display is used as it is.
menuentry "GraveyardOS @VERSION@ live (safe graphics)" --id graveyard-safe {
    linux /boot/vmlinuz graveyard.live=@LABEL@ nomodeset @CMDLINE@
    initrd /boot/initramfs.img
}

# The NVIDIA entry comes with the driver image (nvidia.sfs), see ROADMAP.md.

if [ "${grub_platform}" = efi ]; then
    menuentry "UEFI firmware settings" --id firmware {
        fwsetup
    }
fi
menuentry "Restart" --id restart {
    reboot
}
menuentry "Power off" --id poweroff {
    halt
}
