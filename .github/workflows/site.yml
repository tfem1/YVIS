# The project site (site/), published on GitHub Pages:
# https://tfem1.github.io/YVIS/
#
# One-time setup by the repository owner: Settings > Pages > Source:
# "GitHub Actions". The workflow token cannot turn Pages on by itself.
name: site

on:
  push:
    branches: [main]
    paths: [site/**, branding/yvis-icon.svg, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp site/index.html branding/yvis-icon.svg _site/
          # every file the page references must be in the site
          for f in $(grep -o '\(src\|href\)="[^":#]*"' _site/index.html | sed 's/.*="//; s/"$//' | sort -u); do
            [ -e "_site/$f" ] || { echo "missing: $f"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
