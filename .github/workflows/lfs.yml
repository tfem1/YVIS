# Builds the LFS base of GraveyardOS from lfs/book/ (the pinned book's own commands).
#   toolchain: chapters 5-7 (cross toolchain, temporary tools, chroot tools)
#   system:    chapter 8 (the final base system)
# Each job hands $LFS to the next one as a zstd archive. Only the test suites
# listed in lfs/tests-enabled are run (the others would multiply the build
# time); see lfs/book/*/ for the skipped blocks. Each section's output is in
# the lfs-system-logs artifact; the console shows the end of a failed one.
name: lfs

on:
  workflow_dispatch:
    inputs:
      stop_after:
        description: "Stop after this stage"
        type: choice
        options: [system, toolchain]
        default: system
      toolchain_run:
        description: "Reuse the lfs-toolchain artifact of this run id (skips chapters 5-7)"
        type: string
        default: ""
      system_run:
        description: "Resume chapter 8 from the lfs-system artifact of this run id"
        type: string
        default: ""

permissions:
  contents: read
  actions: read  # download the toolchain artifact of an earlier run

env:
  LFS: /mnt/lfs

jobs:
  toolchain:
    if: inputs.toolchain_run == '' && inputs.system_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt

      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sources
          key: lfs-sources-${{ hashFiles('lfs/wget-list') }}

      - name: Sources (verified against lfs/sources.sha256)
        run: |
          bash lfs/fetch-sources.sh "$RUNNER_TEMP/sources"
          sudo mkdir -p "$LFS/sources"
          sudo cp "$RUNNER_TEMP"/sources/* "$LFS/sources/"

      - name: Host and $LFS (chapter 4)
        run: sudo -E bash lfs/build.sh host

      - name: Chapter 5 — cross toolchain
        run: sudo -E bash lfs/build.sh run ch05

      - name: Chapter 6 — temporary tools
        run: sudo -E bash lfs/build.sh run ch06

      - name: Chapter 7 — chroot and additional tools
        run: sudo -E bash lfs/build.sh run ch07

      - name: Pack
        if: always()
        run: |
          sudo -E bash lfs/build.sh pack "$RUNNER_TEMP/lfs-toolchain.tar.zst"
          ls "$LFS/.graveyard/done" | wc -l | xargs echo "sections done:" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lfs-toolchain
          path: ${{ runner.temp }}/lfs-toolchain.tar.zst
          compression-level: 0
          retention-days: 7

  system:
    needs: toolchain
    if: >-
      always() && inputs.stop_after == 'system' &&
      (needs.toolchain.result == 'success' || needs.toolchain.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt

      - uses: actions/download-artifact@v4
        if: inputs.system_run == ''
        with:
          name: lfs-toolchain
          path: ${{ runner.temp }}
          run-id: ${{ inputs.toolchain_run || github.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        if: inputs.system_run != ''
        with:
          name: lfs-system
          path: ${{ runner.temp }}
          run-id: ${{ inputs.system_run }}
          github-token: ${{ github.token }}

      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sources
          key: lfs-sources-${{ hashFiles('lfs/wget-list') }}

      - name: Restore $LFS and sources
        run: |
          sudo -E bash lfs/build.sh unpack "$RUNNER_TEMP"/lfs-*.tar.zst
          bash lfs/fetch-sources.sh "$RUNNER_TEMP/sources"
          sudo mkdir -p "$LFS/sources"
          sudo cp "$RUNNER_TEMP"/sources/* "$LFS/sources/"
          sudo ln -sf bash /bin/sh

      # Checkpoint before Make: building it froze two runners (no artifact
      # could be packed), and the sections before it take about an hour.
      - name: Chapter 8 — up to libpipeline
        run: sudo -E GRAVEYARD_UNTIL=ch-system-libpipeline bash lfs/build.sh run ch08

      - name: Checkpoint
        run: sudo -E bash lfs/build.sh pack "$RUNNER_TEMP/lfs-system.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: lfs-system
          path: ${{ runner.temp }}/lfs-system.tar.zst
          compression-level: 0
          retention-days: 14

      - name: Chapter 8 — base system
        run: |
          sudo rm -f "$RUNNER_TEMP/lfs-system.tar.zst"
          sudo -E bash lfs/build.sh run ch08

      - name: Verify the system
        run: sudo -E bash lfs/build.sh verify

      - name: Pack
        if: always()
        run: |
          sudo -E bash lfs/build.sh pack "$RUNNER_TEMP/lfs-system.tar.zst"
          ls "$LFS/.graveyard/done" | wc -l | xargs echo "sections done:" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lfs-system
          path: ${{ runner.temp }}/lfs-system.tar.zst
          compression-level: 0
          retention-days: 14
          overwrite: true

      - name: Section logs
        if: always()
        run: sudo tar -C "$LFS/.graveyard" -czf "$RUNNER_TEMP/lfs-system-logs.tar.gz" logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lfs-system-logs
          path: ${{ runner.temp }}/lfs-system-logs.tar.gz
          retention-days: 14
