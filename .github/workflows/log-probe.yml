# Does a step that prints a lot hang? Chapter 8 stopped three times when the
# job log reached about 117 000 lines (25 MB), at two different places of
# the build. This prints more than that, the same way (through sudo), and
# says whether the step survives. Not part of the build.
name: log-probe

on:
  workflow_dispatch:
    inputs:
      lines:
        description: "Lines to print"
        type: string
        default: "200000"
      width:
        description: "Characters per line"
        type: string
        default: "200"
      delay_ms:
        description: "Pause after each line, in milliseconds (0: one burst)"
        type: string
        default: "0"

permissions:
  contents: read

jobs:
  flood:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Print through sudo, as the build did
        env:
          LINES_: ${{ inputs.lines }}
          WIDTH: ${{ inputs.width }}
          DELAY_MS: ${{ inputs.delay_ms }}
        run: |
          # a build prints line by line over an hour, not in one burst
          sudo python3 -u -c '
          import sys, time
          n, width, delay = int(sys.argv[1]), int(sys.argv[2]), int(sys.argv[3]) / 1000
          pad = "x" * width
          for i in range(1, n + 1):
              sys.stdout.write("line %08d %s\n" % (i, pad))
              sys.stdout.flush()
              if delay:
                  time.sleep(delay)
          ' "$LINES_" "$WIDTH" "$DELAY_MS"
          echo "FLOOD SURVIVED: $LINES_ lines printed"
      - name: After the flood
        run: echo "the next step runs"
