# Tests of the LFS build tooling and the YVIS system tools.
name: tools

on:
  push:
    paths: ["lfs/**", "kernel/**", "system/**", "tools/**", ".github/workflows/tools.yml"]
  pull_request:
    paths: ["lfs/**", "kernel/**", "system/**", "tools/**", ".github/workflows/tools.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Book extractor
        run: python3 -m unittest discover -s lfs/tests -v
      - name: Build runner (fake book, as root)
        run: sudo YVIS_LFS_NO_APT=1 bash lfs/tests/build-runner.sh
      - name: GPU detection
        run: sh tools/tests/gpu-detect.sh
      - name: Kernel configuration checker
        run: sh kernel/tests/check-config.sh
      - name: Shellcheck
        run: shellcheck -S warning lfs/build.sh lfs/fetch-sources.sh lfs/verify.sh lfs/verify-yvis.sh kernel/boot-test.sh kernel/check-config.sh kernel/fetch-base-config.sh tools/yvis-gpu-detect
