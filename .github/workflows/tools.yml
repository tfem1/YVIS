# Tests of the LFS build tooling and the GraveyardOS system tools.
name: tools

on:
  push:
    paths: ["lfs/**", "kernel/**", "system/**", "iso/**", "packages/**", "tools/**", ".github/workflows/tools.yml"]
  pull_request:
    paths: ["lfs/**", "kernel/**", "system/**", "iso/**", "packages/**", "tools/**", ".github/workflows/tools.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Book extractor
        run: python3 -m unittest discover -s lfs/tests -v
      - name: Build runner (fake book, as root)
        run: sudo GRAVEYARD_LFS_NO_APT=1 bash lfs/tests/build-runner.sh
      - name: GPU detection
        run: sh tools/tests/gpu-detect.sh
      - name: Package recipes (generator rules, audit)
        run: |
          python3 -m unittest discover -s packages/tests -p 'test_*.py'
          python3 packages/gen-base.py --out "$RUNNER_TEMP/recipes"
          python3 packages/tests/audit-recipes.py "$RUNNER_TEMP/recipes"
      - name: Installer (engine tests, page served in demo mode)
        run: |
          python3 -m unittest discover -s installer/tests -v
          python3 installer/graveyard-installer --demo --port 8475 &
          for i in $(seq 50); do curl -fs http://127.0.0.1:8475/ > page.html && break; sleep 0.2; done
          grep -q 'name="graveyard-key" content="[A-Za-z0-9_-]\{20,\}"' page.html
          # the API refuses requests without the page's key
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8475/api/facts)" = 403 ]
          node --check installer/web/app.js
      - name: Ventoy record reader (compiles cleanly)
        run: gcc -O2 -Wall -Wextra -Werror -o /tmp/vtoy-param system/initramfs/vtoy-param.c
      - name: Kernel configuration checker
        run: sh kernel/tests/check-config.sh
      - name: Shellcheck
        run: shellcheck -S warning lfs/build.sh lfs/fetch-sources.sh lfs/verify.sh lfs/verify-graveyard.sh kernel/boot-test.sh kernel/check-config.sh kernel/fetch-base-config.sh iso/build.sh iso/boot-test.sh iso/ventoy-stick.sh iso/install-test.sh lfs/graveyard/fetch-sources.sh system/initramfs/init lfs/book-commands.sh packages/build-all.sh packages/assemble.sh tools/graveyard-gpu-detect
