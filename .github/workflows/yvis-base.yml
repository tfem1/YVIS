# Turns the chapter 8 system (artifact lfs-system of an `lfs` run) into the
# YVIS base: system configuration (chapter 9), kernel (chapter 10), then the
# checks and a boot in QEMU. YVIS's own sections are in lfs/yvis/.
name: yvis-base

on:
  workflow_dispatch:
    inputs:
      system_run:
        description: "Run id of the `lfs` run whose lfs-system artifact is the starting point"
        type: string
        default: ""
      base_run:
        description: "Or resume from the yvis-base artifact of this run id (skips what is built)"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

env:
  LFS: /mnt/lfs

jobs:
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt

      - uses: actions/download-artifact@v4
        if: inputs.base_run == ''
        with:
          name: lfs-system
          path: ${{ runner.temp }}
          run-id: ${{ inputs.system_run }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        if: inputs.base_run != ''
        with:
          name: yvis-base
          path: ${{ runner.temp }}
          run-id: ${{ inputs.base_run }}
          github-token: ${{ github.token }}

      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sources
          key: lfs-sources-${{ hashFiles('lfs/wget-list') }}

      - name: Restore $LFS and sources
        run: |
          sudo -E bash lfs/build.sh unpack "$RUNNER_TEMP"/*.tar.zst
          sudo rm -f "$RUNNER_TEMP"/*.tar.zst
          bash lfs/fetch-sources.sh "$RUNNER_TEMP/sources"
          bash lfs/yvis/fetch-sources.sh "$RUNNER_TEMP/sources"
          sudo mkdir -p "$LFS/sources"
          sudo cp "$RUNNER_TEMP"/sources/* "$LFS/sources/"
          sudo ln -sf bash /bin/sh

      - name: Chapter 9 — system configuration
        run: sudo -E YVIS_BUILD_ID="${GITHUB_SHA::7}" bash lfs/build.sh run ch09

      - name: Chapter 10 — kernel
        run: sudo -E bash lfs/build.sh run ch10

      - name: Verify the system
        run: sudo -E bash lfs/build.sh verify

      - name: Pack
        if: always()
        run: |
          sudo -E bash lfs/build.sh pack "$RUNNER_TEMP/yvis-base.tar.zst"
          sudo tar -C "$LFS/.yvis" -czf "$RUNNER_TEMP/yvis-base-logs.tar.gz" logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yvis-base
          path: ${{ runner.temp }}/yvis-base.tar.zst
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yvis-base-logs
          path: ${{ runner.temp }}/yvis-base-logs.tar.gz
          retention-days: 14

      - name: Boot test in QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 > /dev/null
          sudo rm -f "$RUNNER_TEMP/yvis-base.tar.zst"
          sudo -E bash kernel/boot-test.sh "$RUNNER_TEMP/boot"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yvis-boot-console
          path: ${{ runner.temp }}/boot/serial.log.txt
          if-no-files-found: ignore
          retention-days: 14
